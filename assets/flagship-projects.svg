      <stop offset="0%" stop-color="#0D0C14"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9814DC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
